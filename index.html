  <!-- Theme: apply stored preference before first paint to prevent FOUC -->
  <script>(function () { 
    try { var h = location.hostname; var v; if (h.startsWith('happy.')) v = 'happy'; else if (h.startsWith('tech.')) v = 'tech'; else if (h.startsWith('finance.')) v = 'finance'; if (!v && (h === 'localhost' || h === '127.0.0.1' || '__TAURI_INTERNALS__' in window)) v = localStorage.getItem('worldmonitor-variant'); if (v) document.documentElement.dataset.variant = v; else document.documentElement.removeAttribute('data-variant'); var t = localStorage.getItem('worldmonitor-theme'); if (t === 'dark' || t === 'light') { document.documentElement.dataset.theme = t; } else if (v === 'happy') { document.documentElement.dataset.theme = 'light'; } } catch (e) { } document.documentElement.classList.add('no-transition'); })()</script>

    /* ---------- skeleton shell (dark default) ---------- */
    .skeleton-shell {
      display: flex;

      height: 100vh;

      font-family: 'SF Mono', 'Monaco', 'Cascadia Code', 'Fira Code', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
      overflow: hidden
    }

    .skeleton-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 8px 16px;
      background: #141414;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0
    }

    .skeleton-header-left {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .skeleton-header-right {

    }
